---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnsmasq-sync
  namespace: kube-system
data:
  sync.sh: |
    #!/bin/bash
    set -euo pipefail
    set -f

    HOSTS_FILE="/etc/kubernetes/hosts"
    DNS_ZONE="${DNS_ZONE:-k8s.example.internal}"
    POLL_INTERVAL="${POLL_INTERVAL:-30}"
    TRAEFIK_NAMESPACE="${TRAEFIK_NAMESPACE:-traefik}"
    TRAEFIK_SERVICE="${TRAEFIK_SERVICE:-traefik}"

    log() {
        echo "[$(date -Iseconds)] $*"
    }

    resolve_hostname_to_ip() {
        local hostname="$1"
        local resolved_ip

        resolved_ip="$(getent ahostsv4 "$hostname" | awk 'NR==1 { print $1; exit }')"
        [[ -n "$resolved_ip" ]] || return 1
        printf '%s\n' "$resolved_ip"
    }

    resolve_traefik_ip() {
        local service_ip service_hostname cluster_ip

        service_ip="$(
            kubectl get svc -n "$TRAEFIK_NAMESPACE" "$TRAEFIK_SERVICE" \
                -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true
        )"
        if [[ -n "$service_ip" ]]; then
            printf '%s\n' "$service_ip"
            return 0
        fi

        service_hostname="$(
            kubectl get svc -n "$TRAEFIK_NAMESPACE" "$TRAEFIK_SERVICE" \
                -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true
        )"
        if [[ -n "$service_hostname" ]]; then
            resolve_hostname_to_ip "$service_hostname"
            return $?
        fi

        cluster_ip="$(
            kubectl get svc -n "$TRAEFIK_NAMESPACE" "$TRAEFIK_SERVICE" \
                -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true
        )"
        if [[ -n "$cluster_ip" && "$cluster_ip" != "None" ]]; then
            printf '%s\n' "$cluster_ip"
            return 0
        fi

        return 1
    }

    add_host_record() {
        local temp_file="$1"
        local ip="$2"
        local host="$3"

        [[ -z "$ip" || -z "$host" ]] && return 0
        echo "${ip} ${host}" >> "$temp_file"
    }

    write_hosts() {
        local temp_file
        local entry_count=0
        local traefik_ip=""
        temp_file=$(mktemp "${HOSTS_FILE}.XXXXXX")

        log "sync started"

        if ! traefik_ip="$(resolve_traefik_ip)"; then
            log "could not resolve Traefik service ${TRAEFIK_NAMESPACE}/${TRAEFIK_SERVICE}"
            traefik_ip=""
        else
            log "resolved Traefik service ${TRAEFIK_NAMESPACE}/${TRAEFIK_SERVICE} to ${traefik_ip}"
        fi
        
        {
            echo "# Kubernetes DNS entries - managed by k8s-dnsmasq sync"
            echo "# $(date -Iseconds)"
            echo ""
        } > "$temp_file"
        
        while IFS=$'\t' read -r namespace name type lb_ip external_name; do
            [[ "$type" != "LoadBalancer" && "$type" != "ExternalName" ]] && continue
            [[ -z "$lb_ip" && -z "$external_name" ]] && continue

            fqdn="${name}.${namespace}.${DNS_ZONE}"

            if [[ -n "$lb_ip" ]]; then
                add_host_record "$temp_file" "$lb_ip" "$fqdn"
                entry_count=$((entry_count + 1))
            elif [[ -n "$external_name" ]]; then
                add_host_record "$temp_file" "$external_name" "$fqdn"
                entry_count=$((entry_count + 1))
            fi
        done < <(
            kubectl get svc -A \
                -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{.spec.type}{"\t"}{.status.loadBalancer.ingress[*].ip}{"\t"}{.spec.externalName}{"\n"}{end}'
        )

        if [[ -n "$traefik_ip" ]]; then
            while IFS=$'\t' read -r namespace name hosts; do
                [[ -z "$hosts" ]] && continue
                for host in $hosts; do
                    [[ -n "$host" ]] || continue
                    add_host_record "$temp_file" "$traefik_ip" "$host"
                    entry_count=$((entry_count + 1))
                done
            done < <(
                kubectl get ingress -A \
                    -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{range .spec.rules[*]}{.host}{" "}{end}{"\n"}{end}'
            )

            while IFS=$'\t' read -r namespace name matches; do
                [[ -z "$matches" ]] && continue
                while IFS= read -r host; do
                    [[ -n "$host" ]] || continue
                    add_host_record "$temp_file" "$traefik_ip" "$host"
                    entry_count=$((entry_count + 1))
                done < <(
                    printf '%s\n' "$matches" | \
                        grep -oE 'Host\(`[^`]+`\)' | \
                        sed -E 's/^Host\(`//; s/`\)$//'
                )
            done < <(
                {
                    kubectl get ingressroute.traefik.io -A \
                        -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{range .spec.routes[*]}{.match}{" "}{end}{"\n"}{end}' 2>/dev/null || true
                    kubectl get ingressroute.traefik.containo.us -A \
                        -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{range .spec.routes[*]}{.match}{" "}{end}{"\n"}{end}' 2>/dev/null || true
                }
            )
        fi
        
        mv -f "$temp_file" "$HOSTS_FILE"
        log "wrote ${entry_count} entries to ${HOSTS_FILE}"
        pkill -HUP dnsmasq || true
        log "signalled dnsmasq to reload"
    }

    write_hosts

    while true; do
        sleep "$POLL_INTERVAL" &
        wait $!
        write_hosts
    done

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-dnsmasq
  namespace: kube-system
  labels:
    app: k8s-dnsmasq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-dnsmasq
  template:
    metadata:
      labels:
        app: k8s-dnsmasq
    spec:
      serviceAccountName: k8s-dnsmasq
      shareProcessNamespace: true
      initContainers:
        - name: init-hosts
          image: debian:trixie-slim
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /etc/kubernetes && \
              touch /etc/kubernetes/hosts && \
              chmod 0777 /etc/kubernetes && \
              chmod 0666 /etc/kubernetes/hosts
          volumeMounts:
            - name: hosts
              mountPath: /etc/kubernetes
      containers:
        - name: dnsmasq
          image: docker.io/dukekautington/dnsmasq:latest-slim
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: k8s-dnsmasq-config
          command:
            - /bin/sh
            - -c
            - |
              exec dnsmasq \
                --no-resolv \
                --no-poll \
                --port=5353 \
                --domain-needed \
                --bogus-priv \
                --local="/${DNS_ZONE}/" \
                --domain="${DNS_ZONE}" \
                --expand-hosts \
                --addn-hosts=/etc/kubernetes/hosts \
                --cache-size=1000 \
                --no-daemon
          ports:
            - name: dns-udp
              containerPort: 5353
              protocol: UDP
            - name: dns-tcp
              containerPort: 5353
              protocol: TCP
          volumeMounts:
            - name: hosts
              mountPath: /etc/kubernetes
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: sync
          image: debian:trixie-slim
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          envFrom:
            - configMapRef:
                name: k8s-dnsmasq-config
          command:
            - /bin/sh
            - -c
            - |
              apt-get update && \
              apt-get install -y --no-install-recommends bash ca-certificates curl procps && \
              KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)" && \
              KUBECTL_ARCH="$(dpkg --print-architecture)" && \
              curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KUBECTL_ARCH}/kubectl" && \
              chmod 0755 /usr/local/bin/kubectl && \
              exec /bin/bash /opt/sync.sh
          volumeMounts:
            - name: hosts
              mountPath: /etc/kubernetes
            - name: sync-script
              mountPath: /opt
          resources:
            requests:
              cpu: 10m
              memory: 32Mi

      volumes:
        - name: hosts
          emptyDir:
            medium: Memory
        - name: sync-script
          configMap:
            name: dnsmasq-sync
            defaultMode: 0755

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-dnsmasq
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-dnsmasq
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io", "traefik.containo.us"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-dnsmasq
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-dnsmasq
subjects:
  - kind: ServiceAccount
    name: k8s-dnsmasq
    namespace: kube-system

---
apiVersion: v1
kind: Service
metadata:
  name: k8s-dnsmasq
  namespace: kube-system
  labels:
    app: k8s-dnsmasq
spec:
  type: LoadBalancer
  # Uncomment and set this if your environment requires a fixed LoadBalancer IP.
  # loadBalancerIP: 172.16.11.53
  selector:
    app: k8s-dnsmasq
  ports:
    - name: dns-udp
      port: 53
      targetPort: 5353
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 5353
      protocol: TCP
