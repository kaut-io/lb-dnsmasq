---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnsmasq-sync
  namespace: kube-system
data:
  sync.sh: |
    #!/bin/bash
    set -euo pipefail
    set -f

    HOSTS_FILE="/etc/kubernetes/hosts"
    DNS_ZONE="${DNS_ZONE:-k8s.example.internal}"
    POLL_INTERVAL="${POLL_INTERVAL:-30}"
    TRAEFIK_NAMESPACE="${TRAEFIK_NAMESPACE:-traefik}"
    TRAEFIK_SERVICE="${TRAEFIK_SERVICE:-traefik}"
    TRAEFIK_INTERNAL_SERVICE="${TRAEFIK_INTERNAL_SERVICE:-}"
    TRAEFIK_INTERNAL_ENTRYPOINTS="${TRAEFIK_INTERNAL_ENTRYPOINTS:-internal web-internal websecure-internal webinternal websecureinternal}"

    log() {
        echo "[$(date -Iseconds)] $*"
    }

    resolve_hostname_to_ip() {
        local hostname="$1"
        local resolved_ip

        resolved_ip="$(getent ahostsv4 "$hostname" | awk 'NR==1 { print $1; exit }')"
        [[ -n "$resolved_ip" ]] || return 1
        printf '%s\n' "$resolved_ip"
    }

    resolve_service_ip() {
        local namespace="$1"
        local service="$2"
        local service_ip service_hostname cluster_ip

        service_ip="$(
            kubectl get svc -n "$namespace" "$service" \
                -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true
        )"
        if [[ -n "$service_ip" ]]; then
            printf '%s\n' "$service_ip"
            return 0
        fi

        service_hostname="$(
            kubectl get svc -n "$namespace" "$service" \
                -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true
        )"
        if [[ -n "$service_hostname" ]]; then
            resolve_hostname_to_ip "$service_hostname"
            return $?
        fi

        cluster_ip="$(
            kubectl get svc -n "$namespace" "$service" \
                -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true
        )"
        if [[ -n "$cluster_ip" && "$cluster_ip" != "None" ]]; then
            printf '%s\n' "$cluster_ip"
            return 0
        fi

        return 1
    }

    is_internal_entrypoint() {
        local route_entrypoints="$1"
        local route_entrypoint internal_entrypoint

        for route_entrypoint in $route_entrypoints; do
            for internal_entrypoint in $TRAEFIK_INTERNAL_ENTRYPOINTS; do
                [[ "$route_entrypoint" == "$internal_entrypoint" ]] && return 0
            done
        done

        return 1
    }

    add_host_record() {
        local temp_file="$1"
        local ip="$2"
        local host="$3"

        [[ -z "$ip" || -z "$host" ]] && return 1
        grep -Fxq "${ip} ${host}" "$temp_file" && return 1
        echo "${ip} ${host}" >> "$temp_file"
        return 0
    }

    extract_ingressroute_hosts() {
        grep -oE 'Host(SNI|Regexp|SNIRegexp)?\([^)]*\)' | \
            sed -E 's/^[^(]+\((.*)\)$/\1/' | \
            tr ',' '\n' | \
            grep -oE '`[^`]+`|"[^"]+"' | \
            sed -E 's/^["`]|["`]$//g' | \
            awk '!/[\{\}\[\]\*\?\|]/'
    }

    write_hosts() {
        local temp_file
        local entry_count=0
        local traefik_ip=""
        local traefik_internal_ip=""
        local target_ip=""
        temp_file=$(mktemp "${HOSTS_FILE}.XXXXXX")

        log "sync started"

        if ! traefik_ip="$(resolve_service_ip "$TRAEFIK_NAMESPACE" "$TRAEFIK_SERVICE")"; then
            log "could not resolve Traefik service ${TRAEFIK_NAMESPACE}/${TRAEFIK_SERVICE}"
            traefik_ip=""
        else
            log "resolved Traefik service ${TRAEFIK_NAMESPACE}/${TRAEFIK_SERVICE} to ${traefik_ip}"
        fi

        if [[ -n "$TRAEFIK_INTERNAL_SERVICE" ]]; then
            if ! traefik_internal_ip="$(resolve_service_ip "$TRAEFIK_NAMESPACE" "$TRAEFIK_INTERNAL_SERVICE")"; then
                log "could not resolve internal Traefik service ${TRAEFIK_NAMESPACE}/${TRAEFIK_INTERNAL_SERVICE}"
                traefik_internal_ip=""
            else
                log "resolved internal Traefik service ${TRAEFIK_NAMESPACE}/${TRAEFIK_INTERNAL_SERVICE} to ${traefik_internal_ip}"
            fi
        fi
        
        {
            echo "# Kubernetes DNS entries - managed by k8s-dnsmasq sync"
            echo "# $(date -Iseconds)"
            echo ""
        } > "$temp_file"
        
        while IFS=$'\t' read -r namespace name type lb_ip external_name; do
            [[ "$type" != "LoadBalancer" && "$type" != "ExternalName" ]] && continue
            [[ -z "$lb_ip" && -z "$external_name" ]] && continue

            fqdn="${name}.${namespace}.${DNS_ZONE}"

            if [[ -n "$lb_ip" ]]; then
                if add_host_record "$temp_file" "$lb_ip" "$fqdn"; then
                    entry_count=$((entry_count + 1))
                fi
            elif [[ -n "$external_name" ]]; then
                if add_host_record "$temp_file" "$external_name" "$fqdn"; then
                    entry_count=$((entry_count + 1))
                fi
            fi
        done < <(
            kubectl get svc -A \
                -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{.spec.type}{"\t"}{.status.loadBalancer.ingress[*].ip}{"\t"}{.spec.externalName}{"\n"}{end}'
        )

        if [[ -n "$traefik_ip" ]]; then
            while IFS=$'\t' read -r namespace name hosts; do
                [[ -z "$hosts" ]] && continue
                for host in $hosts; do
                    [[ -n "$host" ]] || continue
                    if add_host_record "$temp_file" "$traefik_ip" "$host"; then
                        entry_count=$((entry_count + 1))
                    fi
                done
            done < <(
                kubectl get ingress -A \
                    -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{range .spec.rules[*]}{.host}{" "}{end}{"\n"}{end}'
            )

            while IFS=$'\t' read -r namespace name entrypoints matches; do
                target_ip="$traefik_ip"
                if [[ -n "$traefik_internal_ip" ]] && is_internal_entrypoint "$entrypoints"; then
                    target_ip="$traefik_internal_ip"
                fi
                [[ -z "$matches" ]] && continue
                while IFS= read -r host; do
                    [[ -n "$host" ]] || continue
                    if add_host_record "$temp_file" "$target_ip" "$host"; then
                        entry_count=$((entry_count + 1))
                    fi
                done < <(
                    printf '%s\n' "$matches" | extract_ingressroute_hosts
                )
            done < <(
                {
                    kubectl get ingressroutes.traefik.io -A \
                        -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{range .spec.entryPoints[*]}{.}{" "}{end}{"\t"}{range .spec.routes[*]}{.match}{" "}{end}{"\n"}{end}' 2>/dev/null || true
                    kubectl get ingressroutes.traefik.containo.us -A \
                        -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{range .spec.entryPoints[*]}{.}{" "}{end}{"\t"}{range .spec.routes[*]}{.match}{" "}{end}{"\n"}{end}' 2>/dev/null || true
                }
            )
        fi
        
        mv -f "$temp_file" "$HOSTS_FILE"
        log "wrote ${entry_count} entries to ${HOSTS_FILE}"
        pkill -HUP dnsmasq || true
        log "signalled dnsmasq to reload"
    }

    write_hosts

    while true; do
        sleep "$POLL_INTERVAL" &
        wait $!
        write_hosts
    done

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-dnsmasq
  namespace: kube-system
  labels:
    app: k8s-dnsmasq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-dnsmasq
  template:
    metadata:
      labels:
        app: k8s-dnsmasq
    spec:
      serviceAccountName: k8s-dnsmasq
      shareProcessNamespace: true
      initContainers:
        - name: init-hosts
          image: debian:trixie-slim
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /etc/kubernetes && \
              touch /etc/kubernetes/hosts && \
              chmod 0777 /etc/kubernetes && \
              chmod 0666 /etc/kubernetes/hosts
          volumeMounts:
            - name: hosts
              mountPath: /etc/kubernetes
      containers:
        - name: dnsmasq
          image: docker.io/dukekautington/dnsmasq:latest-slim
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: k8s-dnsmasq-config
          command:
            - /bin/sh
            - -c
            - |
              DNSMASQ_CONF_DIR="/etc/kubernetes/dnsmasq.d"
              CNAME_CONF="${DNSMASQ_CONF_DIR}/cnames.conf"
              mkdir -p "$DNSMASQ_CONF_DIR"

              {
                echo "# Static CNAME entries - managed from K8S_DNS_CNAME_RECORDS"
                printf '%s\n' "${K8S_DNS_CNAME_RECORDS:-}" | while IFS= read -r cname_record; do
                  case "$cname_record" in
                    ""|\#*) continue ;;
                  esac

                  case "$cname_record" in
                    *=*)
                      alias="${cname_record%%=*}"
                      target="${cname_record#*=}"
                      ;;
                    *)
                      set -- $cname_record
                      alias="${1:-}"
                      target="${2:-}"
                      extra="${3:-}"
                      if [ -n "$extra" ]; then
                        echo "invalid CNAME record '${cname_record}': expected alias=target or alias target" >&2
                        exit 1
                      fi
                      ;;
                  esac

                  if [ -z "$alias" ] || [ -z "$target" ]; then
                    echo "invalid CNAME record '${cname_record}': expected alias=target or alias target" >&2
                    exit 1
                  fi

                  printf 'cname=%s,%s\n' "$alias" "$target"
                done
              } > "$CNAME_CONF" || exit 1

              exec dnsmasq \
                --no-resolv \
                --no-poll \
                --port=5353 \
                --domain-needed \
                --bogus-priv \
                --local="/${DNS_ZONE}/" \
                --domain="${DNS_ZONE}" \
                --expand-hosts \
                --conf-file="$CNAME_CONF" \
                --addn-hosts=/etc/kubernetes/hosts \
                --cache-size=1000 \
                --no-daemon
          ports:
            - name: dns-udp
              containerPort: 5353
              protocol: UDP
            - name: dns-tcp
              containerPort: 5353
              protocol: TCP
          volumeMounts:
            - name: hosts
              mountPath: /etc/kubernetes
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: sync
          image: debian:trixie-slim
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          envFrom:
            - configMapRef:
                name: k8s-dnsmasq-config
          command:
            - /bin/sh
            - -c
            - |
              apt-get update && \
              apt-get install -y --no-install-recommends bash ca-certificates curl procps && \
              KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)" && \
              KUBECTL_ARCH="$(dpkg --print-architecture)" && \
              curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KUBECTL_ARCH}/kubectl" && \
              chmod 0755 /usr/local/bin/kubectl && \
              exec /bin/bash /opt/sync.sh
          volumeMounts:
            - name: hosts
              mountPath: /etc/kubernetes
            - name: sync-script
              mountPath: /opt
          resources:
            requests:
              cpu: 10m
              memory: 32Mi

      volumes:
        - name: hosts
          emptyDir:
            medium: Memory
        - name: sync-script
          configMap:
            name: dnsmasq-sync
            defaultMode: 0755

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-dnsmasq
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-dnsmasq
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io", "traefik.containo.us"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-dnsmasq
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-dnsmasq
subjects:
  - kind: ServiceAccount
    name: k8s-dnsmasq
    namespace: kube-system

---
apiVersion: v1
kind: Service
metadata:
  name: k8s-dnsmasq
  namespace: kube-system
  labels:
    app: k8s-dnsmasq
spec:
  type: LoadBalancer
  # Uncomment and set this if your environment requires a fixed LoadBalancer IP.
  # loadBalancerIP: 172.16.11.53
  selector:
    app: k8s-dnsmasq
  ports:
    - name: dns-udp
      port: 53
      targetPort: 5353
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 5353
      protocol: TCP
