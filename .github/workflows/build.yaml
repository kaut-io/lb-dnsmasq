name: Scan and Publish

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  REPO: ${{ github.event.repository.name }}
  DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
  BUILD_DIR: "."
  CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
  CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
  CORTEX_API_URL: https://api-ms-ccr.xdr.us.paloaltonetworks.com

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set build metadata
        run: |
          REPO_LOWER=$(echo "${REPO}" | tr '[:upper:]' '[:lower:]')
          BUILD_ID=$(date +'%y_%m_%d')

          IMAGE_AMD64="${DOCKER_USERNAME}/${REPO_LOWER}:${BUILD_ID}-amd64"
          IMAGE_ARM64="${DOCKER_USERNAME}/${REPO_LOWER}:${BUILD_ID}-arm64"
          IMAGE_VERSION="${DOCKER_USERNAME}/${REPO_LOWER}:${BUILD_ID}"
          IMAGE_LATEST="${DOCKER_USERNAME}/${REPO_LOWER}:latest"

          echo "REPO=${REPO_LOWER}" >> "${GITHUB_ENV}"
          echo "BUILD_ID=${BUILD_ID}" >> "${GITHUB_ENV}"
          echo "IMAGE_AMD64=${IMAGE_AMD64}" >> "${GITHUB_ENV}"
          echo "IMAGE_ARM64=${IMAGE_ARM64}" >> "${GITHUB_ENV}"
          echo "IMAGE_VERSION=${IMAGE_VERSION}" >> "${GITHUB_ENV}"
          echo "IMAGE_LATEST=${IMAGE_LATEST}" >> "${GITHUB_ENV}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install scan prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download cortexcli
        run: |
          crtx_resp=$(curl -fsSL "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}")
          crtx_url=$(echo "${crtx_resp}" | jq -r ".signed_url")
          curl -fsSL -o cortexcli "${crtx_url}"
          chmod +x cortexcli
          ./cortexcli --version

      - name: Build amd64 image locally
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t "${IMAGE_AMD64}" \
            "${BUILD_DIR}"

      - name: Scan amd64 image before push
        run: |
          ./cortexcli \
            --api-base-url "${CORTEX_API_URL}" \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            image scan "${IMAGE_AMD64}"

      - name: Build arm64 image locally
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t "${IMAGE_ARM64}" \
            "${BUILD_DIR}"

      - name: Scan arm64 image before push
        run: |
          ./cortexcli \
            --api-base-url "${CORTEX_API_URL}" \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            image scan "${IMAGE_ARM64}"

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: Push architecture images
        if: github.event_name == 'push'
        run: |
          docker push "${IMAGE_AMD64}"
          docker push "${IMAGE_ARM64}"

      - name: Publish multi-arch manifests
        if: github.event_name == 'push'
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_VERSION}" \
            -t "${IMAGE_LATEST}" \
            "${IMAGE_AMD64}" \
            "${IMAGE_ARM64}"
